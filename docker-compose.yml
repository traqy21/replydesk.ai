version: '3.9'

services:
  replydesk-ai:
    build: .
    ports:
      - '8501:8501'
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
