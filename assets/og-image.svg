<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1117"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1d27" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow accent top-right -->
  <radialGradient id="glow" cx="80%" cy="20%" r="40%">
    <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0f1117" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon (centered left area) -->
  <g transform="translate(120, 200) scale(1.8)">
    <circle cx="100" cy="100" r="95" fill="#0f3460"/>
    <rect x="45" y="70" width="110" height="75" rx="8" ry="8" fill="#e0e0e0"/>
    <polygon points="45,70 100,110 155,70" fill="#ffffff" stroke="#0f3460" stroke-width="1"/>
    <g transform="translate(135, 55)">
      <path d="M0,-18 L3,-5 L15,-8 L5,-1 L12,10 L2,5 L0,18 L-2,5 L-12,10 L-5,-1 L-15,-8 L-3,-5 Z"
            fill="#533483" opacity="0.9"/>
      <circle cx="0" cy="0" r="4" fill="#a855f7"/>
    </g>
    <g stroke="#533483" stroke-width="1.5" fill="none" opacity="0.6">
      <line x1="60" y1="100" x2="80" y2="100"/>
      <line x1="80" y1="100" x2="80" y2="115"/>
      <line x1="80" y1="115" x2="105" y2="115"/>
      <circle cx="105" cy="115" r="3" fill="#533483"/>
      <line x1="90" y1="100" x2="120" y2="100"/>
      <line x1="120" y1="100" x2="120" y2="125"/>
      <circle cx="120" cy="125" r="3" fill="#533483"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="480" y="230" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="bold">
    <tspan fill="#e0e4f0">Replydesk </tspan><tspan fill="#a855f7">AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="480" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#888888">
    AI-powered professional communication
  </text>

  <!-- Divider -->
  <line x1="480" y1="340" x2="1080" y2="340" stroke="#1a1d27" stroke-width="2"/>

  <!-- Feature pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e0e4f0">
    <!-- Row 1 -->
    <rect x="480" y="365" width="180" height="44" rx="22" fill="#1a1d27" stroke="#4F8EF7" stroke-width="1"/>
    <text x="570" y="393" text-anchor="middle" fill="#e0e4f0">💬 Client Reply</text>

    <rect x="676" y="365" width="190" height="44" rx="22" fill="#1a1d27" stroke="#4F8EF7" stroke-width="1"/>
    <text x="771" y="393" text-anchor="middle" fill="#e0e4f0">📧 Email Draft</text>

    <rect x="882" y="365" width="200" height="44" rx="22" fill="#1a1d27" stroke="#4F8EF7" stroke-width="1"/>
    <text x="982" y="393" text-anchor="middle" fill="#e0e4f0">📋 Task Summary</text>

    <!-- Row 2 -->
    <rect x="480" y="425" width="190" height="44" rx="22" fill="#1a1d27" stroke="#533483" stroke-width="1"/>
    <text x="575" y="453" text-anchor="middle" fill="#e0e4f0">📊 Daily Report</text>

    <rect x="686" y="425" width="200" height="44" rx="22" fill="#1a1d27" stroke="#533483" stroke-width="1"/>
    <text x="786" y="453" text-anchor="middle" fill="#e0e4f0">🗒️ Meeting Notes</text>

    <rect x="902" y="425" width="180" height="44" rx="22" fill="#1a1d27" stroke="#533483" stroke-width="1"/>
    <text x="992" y="453" text-anchor="middle" fill="#e0e4f0">✏️ Tone Rewriter</text>
  </g>

  <!-- CTA -->
  <rect x="480" y="510" width="340" height="60" rx="30" fill="#4F8EF7"/>
  <text x="650" y="548" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold"
        fill="white" text-anchor="middle">Free to try — replydesk-ai.com</text>
</svg>
