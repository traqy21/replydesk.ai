<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100">
  <!-- Icon -->
  <g transform="translate(10, 5) scale(0.45)">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="95" fill="#0f3460"/>
    <!-- Envelope body -->
    <rect x="45" y="70" width="110" height="75" rx="8" ry="8" fill="#e0e0e0"/>
    <!-- Envelope flap -->
    <polygon points="45,70 100,110 155,70" fill="#ffffff" stroke="#0f3460" stroke-width="1"/>
    <!-- AI Spark -->
    <g transform="translate(135, 55)">
      <path d="M0,-18 L3,-5 L15,-8 L5,-1 L12,10 L2,5 L0,18 L-2,5 L-12,10 L-5,-1 L-15,-8 L-3,-5 Z"
            fill="#533483" opacity="0.9"/>
      <circle cx="0" cy="0" r="4" fill="#a855f7"/>
    </g>
    <!-- Circuit lines -->
    <g stroke="#533483" stroke-width="1.5" fill="none" opacity="0.6">
      <line x1="60" y1="100" x2="80" y2="100"/>
      <line x1="80" y1="100" x2="80" y2="115"/>
      <line x1="80" y1="115" x2="105" y2="115"/>
      <circle cx="105" cy="115" r="3" fill="#533483"/>
      <line x1="90" y1="100" x2="120" y2="100"/>
      <line x1="120" y1="100" x2="120" y2="125"/>
      <circle cx="120" cy="125" r="3" fill="#533483"/>
    </g>
  </g>

  <!-- Text: dark version — #1a1a2e instead of #e0e0e0 -->
  <text x="110" y="52" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">
    <tspan fill="#1a1a2e">Replydesk </tspan><tspan fill="#7c3aed">AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="110" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">
    AI-powered professional communication
  </text>
</svg>
